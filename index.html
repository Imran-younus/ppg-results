let metric = 'stage_delay', metricLabel = 'stage_delay (ps)', vddIdx = 13;

const GROUPS = [
  {label:'6-Track (6TSL)', cells:CELLS6, cls:'tsl6'},
  {label:'7-Track (7TSL)', cells:CELLS7, cls:'tsl7'},
  {label:'8-Track (8TSL)', cells:CELLS8, cls:'tsl8'},
];

function fmt(v) {
  if (v===undefined||isNaN(v)) return '—';
  if (metric==='stage_delay'||metric==='acreff') return v.toPrecision(6);
  return v.toExponential(4);
}
function heat(v, mn, mx) {
  const t = mx===mn ? 0.5 : (v-mn)/(mx-mn);
  const r = t<0.5 ? Math.round(255*t*2) : 255;
  const g = t<0.5 ? Math.round(255*t*2) : Math.round(255*(1-t)*2);
  const b = t<0.5 ? 255 : Math.round(255*(1-t)*2);
  return `rgba(${r},${g},${b},0.2)`;
}
function render() {
  document.getElementById('col-hdr').textContent = metricLabel + ' @ VDD=' + VDD[vddIdx] + 'V';
  document.querySelectorAll('.vdd-btn').forEach((b,i)=>b.classList.toggle('active',i===vddIdx));
  document.querySelectorAll('.metric-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===metric));
  const allC = [...CELLS6,...CELLS7,...CELLS8];
  const vals = allC.map(c=>D[c][metric][vddIdx]);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const tb = document.getElementById('tbody');
  tb.innerHTML='';
  GROUPS.forEach(g=>{
    const htr=document.createElement('tr'); htr.className='grp';
    htr.innerHTML=`<td colspan="2">${g.label}</td>`; tb.appendChild(htr);
    g.cells.forEach(cell=>{
      const v=D[cell][metric][vddIdx];
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><span class="${g.cls}">${cell}</span></td><td class="r" style="background:${heat(v,mn,mx)}">${fmt(v)}</td>`;
      tb.appendChild(tr);
    });
  });
}

  if(m.key===metric) b.classList.add('active');
  b.onclick=()=>{ metric=m.key; metricLabel=m.label; render(); };
  mt.appendChild(b);
});

  const b=document.createElement('button'); b.className='vdd-btn'; b.textContent=v+'V';
  if(i===vddIdx) b.classList.add('active');
  b.onclick=()=>{ vddIdx=i; render(); };
  vb.appendChild(b);
});

render();
</script>
</body>
